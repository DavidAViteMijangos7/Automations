name: CI (cpp)

on:
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - ".github/workflows/ci-cpp.yml"
  pull_request:
    branches: [main]
    paths:
      - "cpp/**"
      - ".github/workflows/ci-cpp.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Set compiler env
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -B cpp/build -S cpp
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test
        working-directory: cpp/build
        run: ctest --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy and clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang-format

      - name: Check formatting
        run: |
          find cpp/src cpp/include cpp/tests -name '*.cpp' -o -name '*.hpp' | \
          xargs clang-format --dry-run --Werror

      - name: Configure (for compile_commands.json)
        run: cmake -B cpp/build -S cpp -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find cpp/src cpp/include -name '*.cpp' -o -name '*.hpp' | \
          xargs clang-tidy -p cpp/build
