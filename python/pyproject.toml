[project]
name = "xlsreport"
version = "0.1.0"
description = "One-line description of what this tool does."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Vite" }]
dependencies = ["typer>=0.12.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
xlsreport = "xlsreport.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsreport"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/xlsreport --cov-report=term-missing"

[tool.coverage.run]
source = ["src/xlsreport"]
omit = ["*/tests/*"]
